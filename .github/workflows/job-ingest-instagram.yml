# GENERATED by scripts/gen-workflows.mjs from scripts/lib/schedule.mjs. Do not edit by hand.
# New Instagram posts -> listings. Schedule is America/Chicago; two UTC crons cover CDT and CST, the guard step lets only the correct one run.
name: job-ingest-instagram

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

# One run at a time per job; a late run finishes instead of being cancelled halfway.
concurrency:
  group: job-ingest-instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Only continue at the intended Chicago time
        run: node scripts/ct-guard.mjs --hour 4
        env:
          EVENT_NAME: ${{ github.event_name }}
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - run: npm run job:ingest-instagram
        if: steps.guard.outputs.run == 'true'
        env:
          SOURCES_MODE: live
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Flag the failure
        if: failure()
        run: echo "::error title=job-ingest-instagram failed::See the job log. The admin was also emailed if ADMIN_EMAIL is configured."
