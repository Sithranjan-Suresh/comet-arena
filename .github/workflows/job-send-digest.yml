# GENERATED by scripts/gen-workflows.mjs from scripts/lib/schedule.mjs. Do not edit by hand.
# Comet Arena Weekly digest. Schedule is America/Chicago; two UTC crons cover CDT and CST, the guard step lets only the correct one run.
name: job-send-digest

on:
  schedule:
    - cron: "0 23 * * 0"
    - cron: "0 0 * * 1"
  workflow_dispatch:

# One run at a time per job; a late run finishes instead of being cancelled halfway.
concurrency:
  group: job-send-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Only continue at the intended Chicago time
        run: node scripts/ct-guard.mjs --hour 18 --dow 0
        env:
          EVENT_NAME: ${{ github.event_name }}
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - run: npm run job:send-digest
        if: steps.guard.outputs.run == 'true'
        env:
          SOURCES_MODE: live
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      - name: Flag the failure
        if: failure()
        run: echo "::error title=job-send-digest failed::See the job log. The admin was also emailed if ADMIN_EMAIL is configured."
