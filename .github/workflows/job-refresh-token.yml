# GENERATED by scripts/gen-workflows.mjs from scripts/lib/schedule.mjs. Do not edit by hand.
# Refresh the Meta long-lived token. Schedule is America/Chicago; two UTC crons cover CDT and CST, the guard step lets only the correct one run.
name: job-refresh-token

on:
  schedule:
    - cron: "45 8 1 * *"
    - cron: "45 9 1 * *"
  workflow_dispatch:

# One run at a time per job; a late run finishes instead of being cancelled halfway.
concurrency:
  group: job-refresh-token
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Only continue at the intended Chicago time
        run: node scripts/ct-guard.mjs --hour 3 --minute 45 --dom 1
        env:
          EVENT_NAME: ${{ github.event_name }}
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - run: npm run job:refresh-token
        if: steps.guard.outputs.run == 'true'
        env:
          SOURCES_MODE: live
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      - name: Flag the failure
        if: failure()
        run: echo "::error title=job-refresh-token failed::See the job log. The admin was also emailed if ADMIN_EMAIL is configured."
