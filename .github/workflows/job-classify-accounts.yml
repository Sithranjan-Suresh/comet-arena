# GENERATED by scripts/gen-workflows.mjs from scripts/lib/schedule.mjs. Do not edit by hand.
# Retest personal Instagram handles. Schedule is America/Chicago; two UTC crons cover CDT and CST, the guard step lets only the correct one run.
name: job-classify-accounts

on:
  schedule:
    - cron: "30 8 * * 6"
    - cron: "30 9 * * 6"
  workflow_dispatch:

# One run at a time per job; a late run finishes instead of being cancelled halfway.
concurrency:
  group: job-classify-accounts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Only continue at the intended Chicago time
        run: node scripts/ct-guard.mjs --hour 3 --minute 30 --dow 6
        env:
          EVENT_NAME: ${{ github.event_name }}
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.run == 'true'
      - run: npm run job:classify-accounts
        if: steps.guard.outputs.run == 'true'
        env:
          SOURCES_MODE: live
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      - name: Flag the failure
        if: failure()
        run: echo "::error title=job-classify-accounts failed::See the job log. The admin was also emailed if ADMIN_EMAIL is configured."
