# Supabase local development config (used by `supabase start`).
# Project ref is set when linking to the hosted project: `supabase link --project-ref <ref>`.
project_id = "comet-arena"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local only: skip confirmation so magic links work straight from Inbucket (http://127.0.0.1:54324).
enable_confirmations = false
otp_expiry = 3600

[inbucket]
enabled = true
port = 54324

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
skip_nonce_check = false
